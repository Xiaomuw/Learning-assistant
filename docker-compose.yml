# ============================================================
# 多 Agent 学习问答助手 — Docker Compose
# ============================================================
# 服务：
#   postgres — PostgreSQL + pgvector
#   backend  — FastAPI (port 8000)
#   frontend — Next.js (port 3000)
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: la-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-learning_assistant}
      - POSTGRES_USER=${POSTGRES_USER:-learning_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-learning_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: la-backend
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-learning_user}:${POSTGRES_PASSWORD:-learning_password}@postgres:5432/${POSTGRES_DB:-learning_assistant}
      - LANGGRAPH_POSTGRES_URL=postgresql://${POSTGRES_USER:-learning_user}:${POSTGRES_PASSWORD:-learning_password}@postgres:5432/${POSTGRES_DB:-learning_assistant}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_ENV=development
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_BASE: http://backend:8000/api
        NEXT_PUBLIC_API_BASE: /api
    container_name: la-frontend
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - INTERNAL_API_BASE=http://backend:8000/api
      - NEXT_PUBLIC_API_BASE=/api
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
