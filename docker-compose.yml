version: "3.9"

# ============================================================
# 多 Agent 学习问答助手 — Docker Compose
# ============================================================
# 服务：
#   backend  — FastAPI (port 8000)
#   frontend — Next.js (port 3000)
#   mysql    — 可选的内置 MySQL 8（profile: with-mysql）
#   chroma   — Chroma 向量数据库 (port 8001)
# ============================================================

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8.4
    container_name: learning-mysql
    restart: unless-stopped
    profiles:
      - with-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=learning_root_123
      - MYSQL_DATABASE=learning_assistant
      - MYSQL_USER=learning_user
      - MYSQL_PASSWORD=learning_pass_123
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Chroma 向量数据库 ----------
  chroma:
    image: chromadb/chroma:0.6.3
    container_name: learning-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"                 # 宿主机 8001 → 容器 8000
    volumes:
      - chroma_data:/chroma/chroma  # 持久化存储
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ---------- FastAPI 后端 ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning-backend
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data      # SQLite 回退 / 本地数据目录
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    depends_on:
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Next.js 前端 ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_BASE: http://backend:8000/api
        NEXT_PUBLIC_API_BASE: /api
    container_name: learning-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - INTERNAL_API_BASE=http://backend:8000/api
      - NEXT_PUBLIC_API_BASE=/api
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
  chroma_data:
    driver: local
  backend_data:
    driver: local
