name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources and tests
        run: python -m compileall -q backend/app backend/tests backend/scripts
      - name: Verify architecture boundaries
        run: python -m unittest discover -s backend/tests -p test_architecture_boundaries.py -v
      - name: Provenance-audit unit tests (synthetic data only)
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Question-bank structure and pending rights report
        run: python scripts/audit_question_bank_provenance.py --json

  web-lint:
    name: Next.js lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  weapp-types:
    name: Taro lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-weapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-weapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build Taro mini-program
        run: npm run build:weapp
        env:
          TARO_APP_ID: touristappid
      - name: Preserve navigation-icon license notices in build output
        run: cmp src/assets/icons/NOTICE.txt dist/assets/icons/NOTICE.txt
