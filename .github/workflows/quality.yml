name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify checkout did not persist HTTP credentials
        run: python3 "$GITHUB_WORKSPACE/scripts/check_ci_checkout.py"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Compile Python sources and tests
        run: python -m compileall -q backend/app backend/tests backend/scripts
      - name: Verify architecture boundaries
        run: python -m unittest discover -s backend/tests -p test_architecture_boundaries.py -v
      - name: Provenance-audit unit tests (synthetic data only)
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Question-bank structure and pending rights report
        run: python scripts/audit_question_bank_provenance.py --json

  web-lint:
    name: Next.js lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify checkout did not persist HTTP credentials
        run: python3 "$GITHUB_WORKSPACE/scripts/check_ci_checkout.py"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  weapp-types:
    name: Taro lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-weapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify checkout did not persist HTTP credentials
        run: python3 "$GITHUB_WORKSPACE/scripts/check_ci_checkout.py"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-weapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build Taro mini-program
        run: npm run build:weapp
        env:
          TARO_APP_ID: touristappid
