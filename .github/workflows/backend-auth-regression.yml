name: Real backend authentication regression

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: auth-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auth-postgres:
    name: Auth, verification and refresh replay (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: learning_assistant_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d learning_assistant_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_user:ephemeral_ci_only@127.0.0.1:5432/learning_assistant_auth_test
      POSTGRES_TEST_STRICT: 'true'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      GRAPH_EVAL_LANGSMITH: 'false'
      APP_ENV: development
      AUTH_COOKIE_SECURE: 'false'
      JWT_SECRET_KEY: isolated-ci-fixture-not-a-production-secret-2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify checkout did not persist HTTP credentials
        run: python3 "$GITHUB_WORKSPACE/scripts/check_ci_checkout.py"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Real authentication API regression
        working-directory: backend
        run: python -m unittest -v tests.test_auth_api
      - name: Refresh token replay and race regression
        working-directory: backend
        run: python -m unittest -v tests.test_auth_refresh_replay
      - name: Verification code regression
        working-directory: backend
        run: python -m unittest -v tests.test_auth_verification

  next-fastapi-http:
    name: Next.js to real FastAPI HTTP authentication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: learning_assistant_web_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d learning_assistant_web_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test_user:ephemeral_ci_only@127.0.0.1:5432/learning_assistant_web_e2e_test
      LANGGRAPH_POSTGRES_URL: postgresql://test_user:ephemeral_ci_only@127.0.0.1:5432/learning_assistant_web_e2e_test
      NEXT_TELEMETRY_DISABLED: '1'
      INTERNAL_API_BASE: http://127.0.0.1:18080/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify checkout did not persist HTTP credentials
        run: python3 "$GITHUB_WORKSPACE/scripts/check_ci_checkout.py"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Reproducible frontend install and build
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Full HTTP auth flow with disposable DB and loopback SMTP sink
        run: python scripts/smoke_real_auth.py --allow-disposable-db
