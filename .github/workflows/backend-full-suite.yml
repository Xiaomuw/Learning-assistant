name: Backend full test suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-full-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Full backend tests on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: learning_assistant_full_suite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d learning_assistant_full_suite_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_only_password@127.0.0.1:5432/learning_assistant_full_suite_test
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_only_password@127.0.0.1:5432/learning_assistant_full_suite_test
      LANGGRAPH_POSTGRES_URL: postgresql://test_user:test_only_password@127.0.0.1:5432/learning_assistant_full_suite_test
      POSTGRES_TEST_STRICT: 'true'
      APP_ENV: development
      AUTH_COOKIE_SECURE: 'false'
      JWT_SECRET_KEY: isolated-ci-only-not-a-production-secret-2026-10
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      GRAPH_EVAL_LANGSMITH: 'false'
      MCP_ENABLED: 'false'
      ENABLE_GRAPH_FACTS: 'true'
      ENABLE_GRAPH_DUAL_WRITE: 'false'
      QA_WEB_SEARCH_EMPTY_CONCEPTS: 'true'
      ENABLE_PRACTICE_FINALIZER_WORKER: 'false'
      MODEL_ACCESS_KEY: ''
      OPENAI_API_KEY: ''
      GOOGLE_API_KEYS: ''
      TAVILY_API_KEY: ''
      LANGSMITH_API_KEY: ''
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_USERNAME: ci-only
      SMTP_PASSWORD: ci-only
      SMTP_FROM_EMAIL: ci@example.invalid
      SMTP_USE_TLS: 'false'
      SMTP_USE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend sources and tests
        working-directory: backend
        run: python -m compileall -q app scripts tests
      - name: Apply Alembic migrations to disposable database
        working-directory: backend
        run: python scripts/run_migrations_with_diagnostics.py
      - name: Bootstrap canonical taxonomy and app settings
        working-directory: backend
        run: python scripts/bootstrap_app_data.py --confirm BOOTSTRAP_APP_DATA
      - name: Run every backend unittest module
        working-directory: backend
        run: python scripts/run_isolated_unittests.py
