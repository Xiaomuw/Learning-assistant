name: Next 16 lockfile refresh

on:
  push:
    branches:
      - chore/security-next16-upgrade-2026-10
    paths:
      - frontend/package.json
      - .github/workflows/security-next16-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'Xiaomuw/Learning-assistant' && github.ref == 'refs/heads/chore/security-next16-upgrade-2026-10'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency lockfile in an isolated runner
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit ONLY the resolved lockfile to this review branch
        run: |
          set -eu
          git add -- frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'The lockfile is already up to date.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): regenerate Next 16 lockfile [skip ci]"
          git push origin HEAD:refs/heads/chore/security-next16-upgrade-2026-10
