name: Development Compose isolation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose-loopback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify checkout did not persist HTTP credentials
        run: python3 "$GITHUB_WORKSPACE/scripts/check_ci_checkout.py"
      - name: Validate Docker Compose configuration
        run: |
          install -m 600 /dev/null backend/.env
          docker compose -f docker-compose.yml config --quiet
      - name: Check ports cannot bind the public host
        run: python -m unittest discover -s scripts/tests -p 'test_dev_compose_safety.py' -v
