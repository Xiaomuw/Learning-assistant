          - concept_id: operating-system.file-system.disk-scheduling
            concept_name: 磁盘调度算法
            aliases: [磁盘调度, FCFS, SSTF, SCAN, C-SCAN, LOOK, 磁头移动距离]
            prerequisites: [operating-system.file-system.allocation]
            importance: medium
            exam_frequency: medium
            question_types: [calculation, simulation]
      - topic_id: operating-system.io
        topic_name: I/O 管理
        concepts:
          - concept_id: operating-system.io.methods
            concept_name: I/O 控制方式
            aliases: [I/O, IO, 程序查询, 中断, DMA, 通道, 缓冲区, 设备管理]
            prerequisites: []
