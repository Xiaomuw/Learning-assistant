            prerequisites: []
            importance: high
            exam_frequency: high
            question_types: [calculation, concept]
          - concept_id: operating-system.memory.tlb-eat
            concept_name: TLB 与有效访问时间
            aliases: [TLB, 快表, 有效访问时间, EAT, 访问时间, 命中率, 多级页表]
            prerequisites: [operating-system.memory.paging]
            importance: high
            exam_frequency: high
            question_types: [calculation]
          - concept_id: operating-system.memory.page-replacement
            concept_name: 页面置换算法
            aliases: [页面置换, FIFO, LRU, Clock, OPT, 缺页, 缺页率, Belady 异常]
            prerequisites: [operating-system.memory.paging]
            importance: high
            exam_frequency: high
            question_types: [calculation, simulation]
  - chapter_id: operating-system.file-io
